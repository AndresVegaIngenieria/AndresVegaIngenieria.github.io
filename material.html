<script>


/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */


const SUPABASE_URL =
"https://oeaixuxafzlotxlcbxeh.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_7IIh-dLRxW6pN-gggGbI5A_VIuww2Sd";


const supabaseClient =
supabase.createClient(

/* =====================================================

    "iot":

    },


    "sistemas-vehiculos-electricos":
    {

        "Sistemas",

        area:
        "Vehículos Eléctricos",

        pagina:
        "vehiculos-electricos.html"
    },


    "electricidad-vehiculos-electricos":
    {
        nombre:
        "Electricidad",

        area:
        "Vehículos Eléctricos",

        pagina:
        "vehiculos-electricos.html"
    },


    "diagramas-vehiculos-electricos":
    {
        nombre:
        "Diagramas",

        area:
        "Vehículos Eléctricos",

        pagina:
        "vehiculos-electricos.html"
    }

};



/* =====================================================
   OBTENER MATERIA DE LA URL
   ===================================================== */

const parametros =
new URLSearchParams(
    window.location.search
);


const materiaID =
parametros.get(
    "materia"
);


const materia =
materias[materiaID];



/* =====================================================
   ELEMENTO PRINCIPAL
   ===================================================== */

const contenido =
document.getElementById(
    "contenido"
);


const volver =
document.getElementById(
    "volver"
);



/* =====================================================
   COMPROBAR ACCESO
   ===================================================== */


const autorizada =
sessionStorage.getItem(
    "materia_autorizada"
);


if(
    !materia ||
    autorizada !== materiaID
){

    window.location.href =
    "acceso.html?materia="
    +
    encodeURIComponent(
        materiaID || ""
    );

}


else{

    volver.href =
    materia.pagina;


    cargarMaterial();

}



/* =====================================================
   CARGAR MATERIAL DESDE SUPABASE
   ===================================================== */

async function cargarMaterial(){

    try{


        /* =============================================
           ENCABEZADO
           ============================================= */

        contenido.innerHTML = `

            <section class="cabecera-materia">

                <div class="area">

                    ${materia.area}

                </div>


                <h2>

                    ${materia.nombre}

                </h2>


                <p>

                    En esta sección encontrarás
                    el material educativo
                    correspondiente a esta materia.

                </p>

            </section>


            <div class="cargando">

                📚 Cargando materiales...

            </div>

        `;



        /* =============================================
           CONSULTAR TABLA
           ============================================= */

        const {

            data,
            error

        } =

        await supabaseClient

        .from(
            "materiales"
        )

        .select("*")

        .eq(
            "materia_id",
            materiaID
        )

        .eq(
            "publicado",
            true
        )

        .order(
            "unidad",
            {
                ascending:true
            }
        );



        if(error){

            throw error;

        }



        console.log(
            "Materiales:",
            data
        );



        mostrarMateriales(
            data || []
        );


    }

    catch(error){

        console.error(
            error
        );


        contenido.innerHTML = `

            <div class="error">

                ❌ <strong>
                No se pudo cargar el material.
                </strong>

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



/* =====================================================
   MOSTRAR MATERIALES
   ===================================================== */

function mostrarMateriales(
    materiales
){


    /* ================================================
       ENCABEZADO
       ================================================ */

    let html = `

        <section class="cabecera-materia">

            <div class="area">

                ${materia.area}

            </div>


            <h2>

                ${materia.nombre}

            </h2>


            <p>

                En esta sección encontrarás
                el material educativo
                correspondiente a esta materia.

            </p>

        </section>

    `;



    /* ================================================
       SIN MATERIAL
       ================================================ */

    if(
        materiales.length === 0
    ){

        html += `

            <div class="sin-material">

                <div class="emoji">
                    📚
                </div>


                <h3>

                    No hay material publicado todavía

                </h3>


                <br>


                <p>

                    El material de esta materia
                    aparecerá aquí automáticamente
                    cuando sea publicado por el docente.

                </p>

            </div>

        `;


        contenido.innerHTML =
        html;


        return;

    }



    /* ================================================
       AGRUPAR POR UNIDAD
       ================================================ */

    const unidades = {};


    materiales.forEach(
        function(material){

            if(
                !unidades[
                    material.unidad
                ]
            ){

                unidades[
                    material.unidad
                ] = [];

            }


            unidades[
                material.unidad
            ].push(
                material
            );

        }
    );



    /* ================================================
       CREAR UNIDADES
       ================================================ */

    Object.keys(
        unidades
    ).forEach(
        function(unidad){

            html += `

                <section class="unidad">

                    <div class="unidad-header">

                        <h3>

                            📂
                            ${formatearUnidad(unidad)}

                        </h3>

                    </div>

            `;


            unidades[
                unidad
            ].forEach(
                function(material){

                    html +=
                    crearMaterial(
                        material
                    );

                }
            );


            html += `

                </section>

            `;

        }
    );



    contenido.innerHTML =
    html;

}



/* =====================================================
   CREAR TARJETA DEL MATERIAL
   ===================================================== */

function crearMaterial(
    material
){


    /* ================================================
       URL DEL ARCHIVO
       ================================================ */

    const resultado =

    supabaseClient

    .storage

    .from(
        "material-educativo"
    )

    .getPublicUrl(
        material.ruta_archivo
    );


    const url =
    resultado.data.publicUrl;



    return `

        <article class="material">


            <div class="material-info">


                <div class="material-titulo">

                    ${obtenerIcono(material.tipo)}

                    ${escaparHTML(
                        material.titulo
                    )}

                </div>


                <div class="material-descripcion">

                    ${
                        material.descripcion
                        ?
                        escaparHTML(
                            material.descripcion
                        )
                        :
                        "Material educativo"
                    }

                </div>


                <span class="tipo">

                    ${material.tipo
                    ?
                    material.tipo.toUpperCase()
                    :
                    "MATERIAL"}

                </span>


            </div>


            <div class="botones">


                <a

                    href="${url}"

                    target="_blank"

                    rel="noopener"

                    class="boton ver">

                    👁 Ver

                </a>


                <a

                    href="${url}"

                    download

                    class="boton descargar">

                    ⬇ Descargar

                </a>


            </div>


        </article>

    `;

}



/* =====================================================
   FORMATEAR UNIDAD
   ===================================================== */

function formatearUnidad(
    unidad
){

    const nombres = {

        "unidad-1":
        "Unidad 1",

        "unidad-2":
        "Unidad 2",

        "unidad-3":
        "Unidad 3",

        "unidad-4":
        "Unidad 4",

        "unidad-5":
        "Unidad 5",

        "practicas":
        "Prácticas",

        "material-complementario":
        "Material Complementario"

    };


    return nombres[
        unidad
    ]
    ||
    unidad;

}



/* =====================================================
   ICONOS
   ===================================================== */

function obtenerIcono(
    tipo
){

    const iconos = {

        "pdf":
        "📄",

        "video":
        "🎥",

        "imagen":
        "🖼️",

        "otro":
        "📎"

    };


    return iconos[
        tipo
    ]
    ||
    "📎";

}



/* =====================================================
   PROTECCIÓN CONTRA HTML
   ===================================================== */

function escaparHTML(
    texto
){

    if(!texto){

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
