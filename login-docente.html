<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Acceso Docente | Andres Vega Ingeniería</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #2563eb
    );
}


.login{

    width:100%;

    max-width:420px;

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.25);

}


h1{

    text-align:center;

    margin-top:0;

    color:#0f172a;
}


.subtitulo{

    text-align:center;

    color:#64748b;

    margin-bottom:30px;
}


label{

    display:block;

    margin-bottom:7px;

    font-weight:bold;

    color:#334155;
}


input{

    width:100%;

    padding:13px;

    margin-bottom:18px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-size:15px;
}


button{

    width:100%;

    padding:14px;

    border:0;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}


button:disabled{

    background:#94a3b8;

    cursor:not-allowed;
}


#mensaje{

    margin-top:20px;

    padding:15px;

    border-radius:8px;

    display:none;

    line-height:1.5;

    font-size:14px;
}


.error{

    display:block !important;

    background:#fee2e2;

    color:#991b1b;
}


.exito{

    display:block !important;

    background:#dcfce7;

    color:#166534;
}


.info{

    display:block !important;

    background:#dbeafe;

    color:#1e40af;
}

</style>

</head>


<body>


<div class="login">

<h1>
👨‍🏫 Acceso Docente
</h1>


<p class="subtitulo">

Andres Vega Ingeniería

</p>


<form id="loginForm">


<label for="email">
Correo electrónico
</label>

<input
type="email"
id="email"
required
autocomplete="email"
>


<label for="password">
Contraseña
</label>

<input
type="password"
id="password"
required
autocomplete="current-password"
>


<button
type="submit"
id="boton">

INICIAR SESIÓN

</button>


</form>


<div id="mensaje"></div>


</div>


<script>


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const SUPABASE_URL =
"https://oeaixuxafzlotxlcbxeh.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_7IIh-dLRxW6pN-gggGbI5A_VIuww2Sd";


/* =====================================================
   CREAR CLIENTE
   ===================================================== */

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENTOS
   ===================================================== */

const formulario =
document.getElementById(
    "loginForm"
);


const boton =
document.getElementById(
    "boton"
);


const mensaje =
document.getElementById(
    "mensaje"
);


/* =====================================================
   FUNCIÓN PARA MOSTRAR MENSAJES
   ===================================================== */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    tipo;

    mensaje.style.display =
    "block";
}


/* =====================================================
   LOGIN
   ===================================================== */

formulario.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        console.log(
            "Formulario enviado"
        );


        const email =
        document.getElementById(
            "email"
        ).value.trim();


        const password =
        document.getElementById(
            "password"
        ).value;


        boton.disabled =
        true;


        boton.textContent =
        "VERIFICANDO...";


        mostrarMensaje(
            "Conectando con Supabase...",
            "info"
        );


        try{


            /* =========================================
               AUTENTICACIÓN
               ========================================= */

            const resultado =
            await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


            console.log(
                "Resultado Auth:",
                resultado
            );


            const data =
            resultado.data;


            const error =
            resultado.error;


            if(error){

                throw new Error(
                    "Error de autenticación: "
                    + error.message
                );

            }


            if(!data || !data.user){

                throw new Error(
                    "Supabase no devolvió un usuario."
                );

            }


            console.log(
                "Usuario autenticado:",
                data.user.id
            );


            mostrarMensaje(
                "Usuario autenticado. Verificando permisos...",
                "info"
            );


            /* =========================================
               COMPROBAR ADMINISTRADOR
               ========================================= */

            const resultadoAdmin =

            await supabaseClient

            .from(
                "administradores"
            )

            .select(
                "id,nombre,activo"
            )

            .eq(
                "id",
                data.user.id
            )

            .maybeSingle();


            console.log(
                "Resultado administrador:",
                resultadoAdmin
            );


            if(
                resultadoAdmin.error
            ){

                throw new Error(

                    "Error consultando administradores: "
                    +
                    resultadoAdmin.error.message

                );

            }


            const administrador =
            resultadoAdmin.data;


            if(!administrador){

                await supabaseClient
                .auth
                .signOut();


                throw new Error(
                    "El usuario inició sesión correctamente, pero NO está registrado como administrador."
                );

            }


            if(
                administrador.activo !== true
            ){

                await supabaseClient
                .auth
                .signOut();


                throw new Error(
                    "El administrador está desactivado."
                );

            }


            /* =========================================
               TODO CORRECTO
               ========================================= */

            mostrarMensaje(
                "✅ Acceso correcto. Entrando al panel docente...",
                "exito"
            );


            console.log(
                "Administrador:",
                administrador
            );


            setTimeout(
                function(){

                    window.location.href =
                    "panel-docente.html";

                },
                1000
            );


        }

        catch(error){

            console.error(
                "ERROR COMPLETO:",
                error
            );


            mostrarMensaje(
                "❌ "
                + error.message,
                "error"
            );


            boton.disabled =
            false;


            boton.textContent =
            "INICIAR SESIÓN";

        }

    }
);

</script>


</body>

</html>
