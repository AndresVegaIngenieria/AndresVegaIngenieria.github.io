<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electrónica Digital | Andres Vega Ingeniería</title>


    <!-- Fuentes -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: 'Inter', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e3a8a 50%,
                    #2563eb 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        /* CONTENEDOR PRINCIPAL */

        .contenedor {

            width: 100%;

            max-width: 470px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            padding: 45px 40px;

            text-align: center;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30);
        }


        /* LOGO / ICONO */

        .icono {

            width: 85px;

            height: 85px;

            margin: 0 auto 22px;

            background: #eff6ff;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.15);
        }


        /* TITULO */

        h1 {

            font-family: 'Poppins', sans-serif;

            font-size: 30px;

            font-weight: 800;

            color: #0f172a;

            margin-bottom: 10px;
        }


        /* SUBTITULO */

        .subtitulo {

            color: #64748b;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* SEPARADOR */

        .separador {

            width: 60px;

            height: 4px;

            background: #2563eb;

            border-radius: 10px;

            margin: 0 auto 30px;
        }


        /* CAMPO */

        .campo {

            text-align: left;

            margin-bottom: 20px;
        }


        .campo label {

            display: block;

            color: #334155;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .campo input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-family: 'Inter', sans-serif;

            font-size: 16px;

            color: #0f172a;

            background: #f8fafc;

            outline: none;

            transition: 0.3s;
        }


        .campo input:focus {

            border-color: #2563eb;

            background: white;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* BOTON */

        .boton {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-family: 'Inter', sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.25);
        }


        .boton:hover {

            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 12px 24px rgba(37, 99, 235, 0.30);
        }


        /* MENSAJE */

        .mensaje {

            min-height: 22px;

            margin-top: 18px;

            font-size: 14px;

            font-weight: 600;
        }


        /* VOLVER */

        .volver {

            display: inline-block;

            margin-top: 25px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }


        .volver:hover {

            color: #2563eb;
        }


        /* INFORMACION */

        .informacion {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.5;
        }


        /* VERSION MOVIL */

        @media (max-width: 500px) {

            .contenedor {

                padding: 35px 25px;

                border-radius: 18px;
            }


            h1 {

                font-size: 26px;
            }


            .icono {

                width: 75px;

                height: 75px;

                font-size: 36px;
            }
        }

    </style>

</head>


<body>


    <main class="contenedor">


        <!-- ICONO -->

        <div class="icono">
            ⚡
        </div>


        <!-- TITULO -->

        <h1>
            Electrónica Digital
        </h1>


        <div class="separador"></div>


        <!-- DESCRIPCION -->

        <p class="subtitulo">

            Material educativo para ingeniería
            electrónica y tecnología automotriz.

            <br>

            Ingresa la contraseña para acceder
            al contenido de esta materia.

        </p>


        <!-- FORMULARIO -->

        <form id="formulario">


            <div class="campo">

                <label for="password">
                    🔐 Contraseña
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa la contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="boton">

                INGRESAR

            </button>


        </form>


        <!-- MENSAJE -->

        <div
            id="mensaje"
            class="mensaje">
        </div>


        <!-- VOLVER -->

        <a
            href="electricidad-electronica-automotriz.html"
            class="volver">

            ← Volver a Electricidad y Electrónica Automotriz

        </a>


        <!-- INFORMACION -->

        <div class="informacion">

            Andres Vega Ingeniería<br>

            Material educativo

        </div>


    </main>


    <!--

        MÁS ADELANTE AQUÍ
        CONECTAREMOS SUPABASE.

        Por ahora NO hay ninguna
        contraseña configurada.

    -->


    <script>

        const formulario =
            document.getElementById("formulario");


        formulario.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const mensaje =
                    document.getElementById("mensaje");


                mensaje.textContent =
                    "El sistema de acceso se configurará próximamente.";

                mensaje.style.color =
                    "#64748b";

            }
        );

    </script>


</body>

</html>
