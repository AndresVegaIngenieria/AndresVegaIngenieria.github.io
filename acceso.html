<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso | Andres Vega Ingeniería</title>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         FUENTES
         ===================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         ESTILOS
         ===================================================== -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: 'Inter', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #2563eb
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .contenedor {

            width: 100%;

            max-width: 470px;

            background: white;

            border-radius: 22px;

            padding: 45px 40px;

            text-align: center;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.30);
        }


        .icono {

            width: 85px;

            height: 85px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;
        }


        h1 {

            font-family: 'Poppins', sans-serif;

            font-size: 29px;

            color: #0f172a;

            margin-bottom: 8px;
        }


        .area {

            color: #2563eb;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 18px;
        }


        .separador {

            width: 60px;

            height: 4px;

            background: #2563eb;

            border-radius: 10px;

            margin: 0 auto 25px;
        }


        .subtitulo {

            color: #64748b;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        .campo {

            text-align: left;

            margin-bottom: 18px;
        }


        .campo label {

            display: block;

            font-size: 14px;

            font-weight: 700;

            color: #334155;

            margin-bottom: 8px;
        }


        .campo input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            background: #f8fafc;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }


        .campo input:focus {

            border-color: #2563eb;

            background: white;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.12);
        }


        .boton {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }


        .boton:hover {

            background: #1d4ed8;

            transform: translateY(-2px);
        }


        .boton:disabled {

            background: #94a3b8;

            cursor: wait;

            transform: none;
        }


        .mensaje {

            min-height: 22px;

            margin-top: 18px;

            font-size: 14px;

            font-weight: 600;
        }


        .error {

            color: #dc2626;
        }


        .exito {

            color: #16a34a;
        }


        .volver {

            display: inline-block;

            margin-top: 25px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        .volver:hover {

            color: #2563eb;
        }


        .informacion {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.6;
        }


        .informacion strong {

            color: #475569;
        }


        @media(max-width:500px) {

            .contenedor {

                padding: 35px 25px;
            }


            h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- =================================================
         ICONO
         ================================================= -->

    <div class="icono">

        🔐

    </div>


    <!-- =================================================
         INFORMACIÓN DE LA MATERIA
         ================================================= -->

    <h1 id="tituloMateria">

        Cargando...

    </h1>


    <div
        id="nombreArea"
        class="area">

    </div>


    <div class="separador"></div>


    <p class="subtitulo">

        Material educativo para ingeniería
        electrónica y tecnología automotriz.

        <br><br>

        Ingresa la contraseña para acceder
        al contenido de esta materia.

    </p>


    <!-- =================================================
         FORMULARIO
         ================================================= -->

    <form id="formulario">


        <div class="campo">

            <label for="password">

                Contraseña

            </label>


            <input
                type="password"
                id="password"
                placeholder="Ingresa la contraseña"
                autocomplete="off"
                required
            >

        </div>


        <button
            type="submit"
            id="botonIngresar"
            class="boton">

            INGRESAR

        </button>


    </form>


    <!-- =================================================
         MENSAJE
         ================================================= -->

    <div
        id="mensaje"
        class="mensaje">

    </div>


    <!-- =================================================
         VOLVER
         ================================================= -->

    <a
        id="botonVolver"
        href="index.html"
        class="volver">

        ← Volver

    </a>


    <!-- =================================================
         INFORMACIÓN
         ================================================= -->

    <div class="informacion">

        <strong>
            Andres Vega Ingeniería
        </strong>

        <br>

        Material educativo

    </div>


</div>



<script>


/* =========================================================
   1. CONFIGURACIÓN DE SUPABASE
   ========================================================= */


/*
   REEMPLAZA ESTOS DOS VALORES.

   Project URL:
   Ejemplo:

   https://xxxxxxxx.supabase.co


   Anon/Public Key:
   Copia la clave pública desde:

   Supabase
   → Settings
   → API
*/


const SUPABASE_URL =
    "https://oeaixuxafzlotxlcbxeh.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_7IIh-dLRxW6pN-gggGbI5A_VIuww2Sd";


/*
   Crear conexión con Supabase
*/


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =========================================================
   2. LISTA DE LAS 20 MATERIAS
   ========================================================= */


const materias = {


    /* =====================================================
       ELECTRICIDAD Y ELECTRÓNICA AUTOMOTRIZ
       ===================================================== */


    "electronica-digital":
    {
        nombre:
            "Electrónica Digital",

        area:
            "Electricidad y Electrónica Automotriz"
    },


    "programacion":
    {
        nombre:
            "Programación",

        area:
            "Electricidad y Electrónica Automotriz"
    },


    "inyeccion-electronica":
    {
        nombre:
            "Sistemas de Inyección Electrónica",

        area:
            "Electricidad y Electrónica Automotriz"
    },


    "sistemas-encendido":
    {
        nombre:
            "Sistemas de Encendido",

        area:
            "Electricidad y Electrónica Automotriz"
    },


    "ecus":
    {
        nombre:
            "ECUS",

        area:
            "Electricidad y Electrónica Automotriz"
    },


    "tableros-electronicos":
    {
        nombre:
            "Tableros Electrónicos",

        area:
            "Electricidad y Electrónica Automotriz"
    },


    "diagramas-electricos":
    {
        nombre:
            "Diagramas Eléctricos",

        area:
            "Electricidad y Electrónica Automotriz"
    },



    /* =====================================================
       INGENIERÍA ELECTRÓNICA
       ===================================================== */


    "electronica-digital-ingenieria":
    {
        nombre:
            "Electrónica Digital",

        area:
            "Ingeniería Electrónica"
    },


    "electromagnetismo":
    {
        nombre:
            "Electromagnetismo",

        area:
            "Ingeniería Electrónica"
    },


    "electronica-analogica":
    {
        nombre:
            "Electrónica Analógica",

        area:
            "Ingeniería Electrónica"
    },


    "circuitos-electricos":
    {
        nombre:
            "Circuitos Eléctricos",

        area:
            "Ingeniería Electrónica"
    },


    "robotica":
    {
        nombre:
            "Robótica",

        area:
            "Ingeniería Electrónica"
    },


    "sistemas-control":
    {
        nombre:
            "Sistemas de Control",

        area:
            "Ingeniería Electrónica"
    },


    "fisica-3":
    {
        nombre:
            "Física 3",

        area:
            "Ingeniería Electrónica"
    },


    "programacion-java":
    {
        nombre:
            "Programación en Java",

        area:
            "Ingeniería Electrónica"
    },


    "microcontroladores":
    {
        nombre:
            "Programación de Microcontroladores",

        area:
            "Ingeniería Electrónica"
    },


    "iot":
    {
        nombre:
            "IoT",

        area:
            "Ingeniería Electrónica"
    },



    /* =====================================================
       VEHÍCULOS ELÉCTRICOS
       ===================================================== */


    "sistemas-vehiculos-electricos":
    {
        nombre:
            "Sistemas",

        area:
            "Vehículos Eléctricos"
    },


    "electricidad-vehiculos-electricos":
    {
        nombre:
            "Electricidad",

        area:
            "Vehículos Eléctricos"
    },


    "diagramas-vehiculos-electricos":
    {
        nombre:
            "Diagramas",

        area:
            "Vehículos Eléctricos"
    }

};



/* =========================================================
   3. OBTENER MATERIA DESDE LA URL
   ========================================================= */


const parametros =
    new URLSearchParams(
        window.location.search
    );


const materiaID =
    parametros.get("materia");


const materia =
    materias[materiaID];



/* =========================================================
   4. ELEMENTOS DE LA PÁGINA
   ========================================================= */


const tituloMateria =
    document.getElementById(
        "tituloMateria"
    );


const nombreArea =
    document.getElementById(
        "nombreArea"
    );


const formulario =
    document.getElementById(
        "formulario"
    );


const password =
    document.getElementById(
        "password"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const botonIngresar =
    document.getElementById(
        "botonIngresar"
    );


const botonVolver =
    document.getElementById(
        "botonVolver"
    );



/* =========================================================
   5. MOSTRAR INFORMACIÓN DE LA MATERIA
   ========================================================= */


if (!materia) {


    tituloMateria.textContent =
        "Materia no encontrada";


    nombreArea.textContent =
        "";


    formulario.style.display =
        "none";


    mensaje.textContent =
        "El enlace de la materia no es válido.";


    mensaje.className =
        "mensaje error";


}


else {


    tituloMateria.textContent =
        materia.nombre;


    nombreArea.textContent =
        materia.area;


}



/* =========================================================
   6. BOTÓN VOLVER
   ========================================================= */


botonVolver.addEventListener(
    "click",
    function() {

        history.back();

    }
);



/* =========================================================
   7. VERIFICAR CONTRASEÑA
   ========================================================= */


formulario.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        /* ---------------------------------------------
           Comprobar materia
           --------------------------------------------- */


        if (!materia) {

            return;

        }


        /* ---------------------------------------------
           Obtener contraseña
           --------------------------------------------- */


        const clave =
            password.value.trim();


        if (!clave) {


            mensaje.textContent =
                "Ingresa una contraseña.";


            mensaje.className =
                "mensaje error";


            return;

        }


        /* ---------------------------------------------
           Estado del botón
           --------------------------------------------- */


        botonIngresar.disabled =
            true;


        botonIngresar.textContent =
            "VERIFICANDO...";


        mensaje.textContent =
            "";


        try {


            /* =========================================
               LLAMAR A LA FUNCIÓN SEGURA DE SUPABASE
               ========================================= */


            const { data, error } =
                await supabaseClient.rpc(
                    "verificar_materia",
                    {
                        p_materia:
                            materiaID,

                        p_password:
                            clave
                    }
                );


            /* -----------------------------------------
               Error de Supabase
               ----------------------------------------- */


            if (error) {


                console.error(
                    "Error Supabase:",
                    error
                );


                throw error;

            }


            /* =========================================
               CONTRASEÑA CORRECTA
               ========================================= */


            if (
                data &&
                data.length > 0
            ) {


                mensaje.textContent =
                    "Contraseña correcta. Ingresando...";


                mensaje.className =
                    "mensaje exito";


                /*
                   Guardar autorización temporal.

                   sessionStorage se elimina cuando
                   se cierra la pestaña.
                */


                sessionStorage.setItem(
                    "materia_autorizada",
                    materiaID
                );


                sessionStorage.setItem(
                    "nombre_materia",
                    materia.nombre
                );


                sessionStorage.setItem(
                    "area_materia",
                    materia.area
                );


                /*
                   Esperar un momento para mostrar
                   el mensaje de éxito.
                */


                setTimeout(
                    function() {

                        window.location.href =
                            "material.html?materia="
                            + encodeURIComponent(
                                materiaID
                            );

                    },
                    500
                );


            }


            /* =========================================
               CONTRASEÑA INCORRECTA
               ========================================= */


            else {


                mensaje.textContent =
                    "Contraseña incorrecta.";


                mensaje.className =
                    "mensaje error";


                password.value =
                    "";


                password.focus();

            }


        }


        catch(error) {


            console.error(error);


            mensaje.textContent =
                "No se pudo conectar con el sistema de acceso.";


            mensaje.className =
                "mensaje error";

        }


        finally {


            botonIngresar.disabled =
                false;


            botonIngresar.textContent =
                "INGRESAR";

        }

    }

);


</script>


</body>

</html>
